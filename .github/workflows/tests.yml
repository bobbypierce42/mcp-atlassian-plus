# .github/workflows/tests.yml

name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Run pytest on Python ${{ matrix.python-version }}
    runs-on: kalana-ci
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.13.0"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --all-extras --dev

    - name: Run tests with pytest
      # Add -v for verbose output, helpful in CI
      # Add basic coverage reporting to terminal logs
      # E2E tests (tests/e2e/) are auto-skipped without --dc-e2e flag
      run: uv run pytest -v --cov=src/mcp_atlassian --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml

    - name: Upload test and coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-python-${{ matrix.python-version }}
        path: |
          test-results.xml
          coverage.xml
        if-no-files-found: ignore
        retention-days: 7
